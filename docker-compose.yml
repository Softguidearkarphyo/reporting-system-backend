services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reporting-app
    volumes:
      - .:/var/www
      - ./docker/php/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    working_dir: /var/www
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      INSTALL_COMPOSER_DEPS: "1"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: reporting-nginx
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: reporting-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${DB_DATABASE:-reporting}
    ports:
      - "33308:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reporting-queue
    volumes:
      - .:/var/www
      - ./docker/php/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    working_dir: /var/www
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    command: php artisan queue:work --sleep=3 --tries=1
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reporting-scheduler
    volumes:
      - .:/var/www
      - ./docker/php/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    working_dir: /var/www
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    command: php artisan schedule:work
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  dbdata:
    name: reporting-system_backend_dbdata
